<div id="GP_CelluloseCart">
  <style>
    #GP_CelluloseCart * { box-sizing: border-box; }
    #GP_CelluloseCart .cart-wrap {
      max-width: 960px; margin: 12px auto 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
    }
    #GP_CelluloseCart .cart-block {
      background: #ffffff;
      border: 1px solid rgba(180, 180, 185, 0.7);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.10);
      padding: 28px 40px;
      display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    }
    #GP_CelluloseCart .cart-summary { flex: 1; min-width: 200px; }
    #GP_CelluloseCart .cart-summary-label {
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .06em; color: #8a94a6; margin-bottom: 6px;
    }
    #GP_CelluloseCart .cart-qty-big {
      font-size: 36px; font-weight: 800; color: #111111;
      line-height: 1; letter-spacing: -0.02em;
    }
    #GP_CelluloseCart .cart-qty-unit {
      font-size: 14px; font-weight: 600; color: #6b7280; margin-left: 6px;
    }
    #GP_CelluloseCart .cart-qty-detail {
      font-size: 12px; color: #8a94a6; margin-top: 4px;
    }
    #GP_CelluloseCart .cart-actions {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    #GP_CelluloseCart .cart-qty-input-wrap {
      display: flex; flex-direction: column; gap: 4px;
    }
    #GP_CelluloseCart .cart-qty-input-label {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .06em; color: #8a94a6;
    }
    #GP_CelluloseCart .cart-qty-input {
      width: 100px; height: 56px; padding: 0 16px;
      font-size: 22px; font-weight: 700; color: #111111;
      border: 1px solid #b0b0b8; border-radius: 14px;
      background: #fff; outline: none; text-align: center;
      font-family: Inter, Arial, Helvetica, sans-serif;
      transition: border-color .15s;
    }
    #GP_CelluloseCart .cart-qty-input:focus { border-color: #2d2d2d; }
    #GP_CelluloseCart .btn-add-cart {
      height: 56px; padding: 0 32px;
      font-size: 15px; font-weight: 800; letter-spacing: .03em;
      border-radius: 14px; border: none;
      background: #1a1a1a; color: #fff;
      cursor: pointer; display: flex; align-items: center; gap: 10px;
      font-family: Inter, Arial, Helvetica, sans-serif;
      transition: background .15s, transform .1s;
      white-space: nowrap;
    }
    #GP_CelluloseCart .btn-add-cart:hover  { background: #333333; }
    #GP_CelluloseCart .btn-add-cart:active { transform: scale(0.98); }
    #GP_CelluloseCart .btn-add-cart:disabled {
      background: #a7b0bf; cursor: not-allowed; transform: none;
    }
    #GP_CelluloseCart .cart-feedback {
      font-size: 12px; font-weight: 600; margin-top: 8px; display: none;
    }
    #GP_CelluloseCart .cart-feedback.ok    { display: block; color: #1a1a1a; }
    #GP_CelluloseCart .cart-feedback.error { display: block; color: #dc2626; }
    @media (max-width: 580px) {
      #GP_CelluloseCart .cart-block { padding: 20px; gap: 16px; }
      #GP_CelluloseCart .cart-qty-big { font-size: 28px; }
      #GP_CelluloseCart .btn-add-cart { padding: 0 20px; font-size: 14px; }
    }
  </style>

  <div class="cart-wrap">
    <div class="cart-block">

      <div class="cart-summary">
        <div class="cart-summary-label">Quantité à commander</div>
        <div>
          <span class="cart-qty-big" id="GPC_qty_display">—</span>
          <span class="cart-qty-unit">sacs</span>
        </div>
        <div class="cart-qty-detail" id="GPC_qty_detail">Calculez d'abord le nombre de sacs ci-dessus.</div>
      </div>

      <div class="cart-actions">
        <div class="cart-qty-input-wrap">
          <span class="cart-qty-input-label">Qté finale</span>
          <input class="cart-qty-input" id="GPC_qty_input" type="number" min="1" max="9999" placeholder="0">
        </div>
        <div>
          <button class="btn-add-cart" id="GPC_btn_add" disabled="disabled">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 001.99 1.61h9.72a2 2 0 001.99-1.61L23 6H6"></path>
            </svg>
            Ajouter au panier
          </button>
          <div class="cart-feedback" id="GPC_feedback"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
  (function () {
    var ROOT = document.getElementById('GP_CelluloseCart');
    if (!ROOT) return;
    if (ROOT.getAttribute('data-gpc-init') === '1') return;
    ROOT.setAttribute('data-gpc-init', '1');

    var PRODUCT_TEMPLATE_ID = 307;
    var PRODUCT_VARIANT_ID  = 482;

    var qtyInput   = ROOT.querySelector('#GPC_qty_input');
    var qtyDisplay = ROOT.querySelector('#GPC_qty_display');
    var qtyDetail  = ROOT.querySelector('#GPC_qty_detail');
    var btnAdd     = ROOT.querySelector('#GPC_btn_add');
    var feedback   = ROOT.querySelector('#GPC_feedback');

    /* ── Sync depuis le calculateur ── */
    function syncFromCalc() {
      var surplusEl = document.getElementById('CC_meta_surplus');
      var bagsEl    = document.getElementById('CC_bags_num');
      var sNum = parseInt(surplusEl ? surplusEl.textContent : '', 10);
      var bNum = parseInt(bagsEl    ? bagsEl.textContent    : '', 10);
      var qty  = (!isNaN(sNum) && sNum > 0) ? sNum : ((!isNaN(bNum) && bNum > 0) ? bNum : NaN);

      if (!isNaN(qty)) {
        qtyDisplay.textContent = qty;
        qtyInput.value         = qty;
        btnAdd.disabled        = false;
        qtyDetail.textContent  = !isNaN(bNum) && bNum > 0
          ? bNum + ' sacs nets + surplus = ' + qty + ' sacs'
          : qty + ' sacs';
      } else {
        qtyDisplay.textContent = '\u2014';
        qtyInput.value         = '';
        btnAdd.disabled        = true;
        qtyDetail.textContent  = 'Calculez d\u2019abord le nombre de sacs ci-dessus.';
      }
    }

    function observeEl(id) {
      var el = document.getElementById(id);
      if (el) new MutationObserver(syncFromCalc).observe(el, { childList: true, characterData: true, subtree: true });
    }
    observeEl('CC_bags_num');
    observeEl('CC_meta_surplus');

    qtyInput.addEventListener('input', function () {
      var v = parseInt(qtyInput.value, 10);
      qtyDisplay.textContent = (!isNaN(v) && v > 0) ? v : '\u2014';
      btnAdd.disabled = isNaN(v) || v < 1;
    });

    /* ── Feedback ── */
    function setFeedback(msg, type) {
      feedback.innerHTML = msg;
      feedback.className = 'cart-feedback ' + type;
    }

    function resetBtn() {
      btnAdd.disabled = false;
      btnAdd.innerHTML =
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
        + '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>'
        + '<path d="M1 1h4l2.68 13.39a2 2 0 001.99 1.61h9.72a2 2 0 001.99-1.61L23 6H6"/>'
        + '</svg> Ajouter au panier';
    }

    /* ── Ajouter au panier — JSON-RPC /shop/cart/add ── */
    btnAdd.addEventListener('click', function () {
      var qty = parseInt(qtyInput.value, 10);
      if (isNaN(qty) || qty < 1) return;

      btnAdd.disabled    = true;
      btnAdd.textContent = 'Ajout en cours\u2026';
      feedback.className = 'cart-feedback';

      var payload = JSON.stringify({
        jsonrpc: '2.0',
        method:  'call',
        id:      Math.floor(Math.random() * 10000),
        params: {
          product_template_id:             PRODUCT_TEMPLATE_ID,
          product_id:                      PRODUCT_VARIANT_ID,
          quantity:                        qty,
          add_qty:                         qty,
          product_custom_attribute_values: [],
          no_variant_attribute_values:     []
        }
      });

      fetch('/shop/cart/add', {
        method:      'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          'Accept':       'application/json'
        },
        body: payload
      })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.error) {
          setFeedback('\u26a0 ' + (data.error.data ? data.error.data.message : JSON.stringify(data.error)), 'error');
          resetBtn();
        } else {
          resetBtn();
          setFeedback(
            '\u2713 ' + qty + ' sacs ajout\u00e9s au panier!\u00a0'
            + '<a href="/shop/cart" style="color:#1a1a1a;font-weight:800;text-decoration:underline;">'
            + 'Voir le panier \u2192</a>',
            'ok'
          );
        }
      })
      .catch(function (err) {
        setFeedback('\u26a0 Erreur: ' + err.message, 'error');
        resetBtn();
      });

    });

    syncFromCalc();
  })();
  </script>
</div>
